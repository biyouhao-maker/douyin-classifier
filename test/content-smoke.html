<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>content.js 注入冒烟测试（开发用，不属于扩展 UI）</title></head>
<body>
  <div id="result">running…</div>
  <script>
    // Mock 最小 chrome API（仅验证 content.js 能否完整执行并注入悬浮球）
    window.chrome = {
      runtime: {
        lastError: null,
        getURL: (p) => 'chrome-extension://fake/' + p,
        sendMessage: (msg, cb) => {
          const res = { getCounts: { ok: true, counts: { total: 3, classified: 2, unclassified: 1 } },
                        getSyncReport: { ok: true, report: { jobs: {}, lastSync: { like: { at: Date.now() - 600000, status: 'done', added: 2, existing: 20, failed: 0 } } } },
                        getKnownIds: { ok: true, ids: [], tombstoneIds: [] },
                        startSyncJob: { ok: false, reason: 'locked' } }[msg.type] || { ok: true };
          setTimeout(() => cb && cb(res), 5);
        },
        onMessage: { addListener: () => {} },
      },
      storage: { local: { get: async () => ({}), set: async () => {}, remove: async () => {} } },
    };
    window.addEventListener('error', (e) => {
      document.getElementById('result').textContent = 'PAGE ERROR: ' + e.message + ' @ ' + (e.filename || '') + ':' + e.lineno;
      document.getElementById('result').style.color = 'red';
    });
  </script>
  <script src="../lib/common.js?v=smoke2"></script>
  <script src="../content/content.js?v=smoke2"></script>
  <script>
    setTimeout(() => {
      const host = document.querySelector('div[style*="2147483647"]');
      const shadow = host && host.shadowRoot;
      const bubble = shadow && shadow.querySelector('.bubble');
      const panel = shadow && shadow.querySelector('.panel');
      const autosync = shadow && shadow.querySelector('.autosync');
      const r = document.getElementById('result');
      if (bubble && panel && autosync) {
        r.textContent = 'OK：悬浮球/面板/自动同步行均已注入。autosync 行内容：' + (autosync.textContent || '(空)');
        r.style.color = 'green';
      } else {
        r.textContent = 'FAIL：bubble=' + !!bubble + ' panel=' + !!panel + ' autosync=' + !!autosync;
        r.style.color = 'red';
      }
    }, 800);
  </script>
</body>
</html>
